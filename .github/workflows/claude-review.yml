   name: Code Review
   on:
     pull_request:
       types: [opened, synchronize, ready_for_review, reopened]
   jobs:
     review:
       runs-on: ubuntu-latest
       timeout-minutes: 10
       permissions:
         contents: read
         pull-requests: write
         issues: read
         id-token: write
       steps:
         - uses: actions/checkout@v6
           with:
             fetch-depth: 1
         - uses: anthropics/claude-code-action@v1
           with:
             claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
             prompt: |
               You are the reviewer agent for ${{ github.repository }}.
               Review pull request #${{ github.event.pull_request.number }}.

               1. Read the PR and its linked issue with `gh pr view`, and the changes with `gh pr diff`.
               2. Read CLAUDE.md and check the changes follow its rules.
               3. Check for real problems: code that will crash, gives wrong results,
                  or doesn't do what the linked issue asked for.
               4. Always post exactly one comment with `gh pr comment`, starting with "## Review".
                  Either say "Approved: no issues found" with a one-line summary of what you checked,
                  or list each problem with the file, the line, and a suggested fix.

               Do not edit any code. Keep the comment short.
             claude_args: |
               --allowedTools "Read,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
